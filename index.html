<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fedd58">
    <title>HYM Cotizaciones</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css">
    <script src="vendor/pdf-lib.min.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="view active" id="homeView" aria-labelledby="homeTitle">
        <div class="brand">
          <img src="assets/logo-hym.png" alt="HYM Servicios Generales" class="brand-logo">
          <h1 id="homeTitle">HYM Cotizaciones</h1>
        </div>
        <div class="home-actions">
          <button class="primary-action" id="newQuoteButton" type="button">Generar una nueva cotización</button>
          <button class="primary-action" id="newTicketButton" type="button">Generar ticket de pago</button>
          <button class="secondary-action" id="managerButton" type="button">Gestor de ingresos y egresos</button>
        </div>
      </section>

      <section class="view" id="managerView" aria-labelledby="managerTitle">
        <header class="topbar">
          <button class="icon-button" data-action="home" type="button" aria-label="Volver">‹</button>
          <h2 id="managerTitle">Ingresos y egresos</h2>
        </header>

        <div class="finance-summary" aria-label="Resumen financiero">
          <div class="summary-cell">
            <span>Ingresos</span>
            <strong id="managerIncome">S/ 0.00</strong>
          </div>
          <div class="summary-cell">
            <span>Egresos</span>
            <strong id="managerExpenses">S/ 0.00</strong>
          </div>
          <div class="summary-cell summary-balance">
            <span>Balance</span>
            <strong id="managerBalance">S/ 0.00</strong>
          </div>
        </div>

        <label class="manager-filter">
          <span>Mostrar movimientos</span>
          <select id="managerFilter">
            <option value="all">Todos</option>
            <option value="quotes">Ingresos de cotizaciones</option>
            <option value="tickets">Ingresos de tickets</option>
            <option value="expenses">Egresos</option>
          </select>
        </label>

        <div id="managerList" class="history-list manager-list"></div>

        <div class="manager-history-actions">
          <button class="secondary-action" id="quoteHistoryButton" type="button">Historial de cotizaciones</button>
          <button class="secondary-action" id="managerTicketHistoryButton" type="button">Historial de tickets</button>
        </div>
      </section>

      <section class="view" id="formView" aria-labelledby="formTitle">
        <header class="topbar">
          <button class="icon-button" data-action="home" type="button" aria-label="Volver">‹</button>
          <h2 id="formTitle">Nueva cotización</h2>
        </header>

        <form id="quoteForm" autocomplete="off">
          <label>
            <span>Fecha</span>
            <input id="quoteDate" name="quoteDate" type="date" required>
          </label>

          <label>
            <span>Nombre completo del cliente</span>
            <input id="clientName" name="clientName" type="text" required>
          </label>

          <div class="items-heading">
            <h3>Servicios o productos</h3>
            <button class="small-button" id="addItemButton" type="button">Agregar</button>
          </div>

          <div id="itemsList" class="items-list"></div>

          <label>
            <span>Condiciones Comerciales</span>
            <textarea id="commercialConditions" name="commercialConditions"></textarea>
          </label>

          <div class="total-panel">
            <span>Costo total</span>
            <strong id="grandTotal">S/ 0.00</strong>
          </div>

          <button class="primary-action" id="continueButton" type="submit" disabled>Continuar</button>
        </form>
      </section>

      <section class="view" id="previewView" aria-labelledby="previewTitle">
        <header class="topbar preview-topbar">
          <button class="icon-button" data-action="form" type="button" aria-label="Editar">‹</button>
          <h2 id="previewTitle">Previsualización</h2>
          <div class="preview-actions">
            <button class="small-button" id="downloadButton" type="button">Descargar PDF</button>
            <button class="small-button" id="shareButton" type="button">Compartir</button>
            <button class="small-button" id="openLayoutEditorButton" type="button">Ajustar texto</button>
          </div>
        </header>
        <div class="pdf-preview-scroll" aria-label="Previsualización de cotización">
          <div id="pdfPreviewPages" class="pdf-preview-pages">
            <canvas id="pdfPreviewCanvas" class="pdf-preview-page"></canvas>
          </div>
        </div>
      </section>

      <section class="view" id="layoutEditorView" aria-labelledby="layoutEditorTitle">
        <header class="topbar">
          <button class="icon-button" data-action="preview" type="button" aria-label="Volver">‹</button>
          <h2 id="layoutEditorTitle">Ajustar texto</h2>
        </header>

        <div class="layout-editor-controls">
          <label>
            <span>Texto</span>
            <select id="layoutFieldSelect">
              <option value="date">Fecha</option>
              <option value="client">Cliente</option>
              <option value="description">Descripción</option>
              <option value="total">Total</option>
              <option value="conditions">Condiciones comerciales</option>
            </select>
          </label>
          <div class="coordinate-grid">
            <label><span>X</span><input id="layoutX" type="number" step="0.5"></label>
            <label><span>Y</span><input id="layoutY" type="number" step="0.5"></label>
            <label><span>Tamaño</span><input id="layoutSize" type="number" min="5" max="24" step="0.5"></label>
          </div>
          <div class="layout-editor-actions">
            <button class="secondary-action" id="resetLayoutFieldButton" type="button">Restaurar</button>
            <button class="primary-action" id="saveLayoutButton" type="button">Guardar en PDF</button>
          </div>
        </div>

        <div class="layout-editor-stage" id="layoutEditorStage">
          <canvas id="layoutEditorCanvas" aria-label="Editor visual de coordenadas"></canvas>
        </div>
      </section>

      <section class="view" id="historyView" aria-labelledby="historyTitle">
        <header class="topbar">
          <button class="icon-button" data-action="manager" type="button" aria-label="Volver">‹</button>
          <h2 id="historyTitle">Historial de cotizaciones</h2>
        </header>
        <div id="historyList" class="history-list"></div>
      </section>

      <section class="view" id="ticketFormView" aria-labelledby="ticketFormTitle">
        <header class="topbar">
          <button class="icon-button" data-action="home" type="button" aria-label="Volver">‹</button>
          <h2 id="ticketFormTitle">Ticket de pago</h2>
        </header>

        <form id="ticketForm" autocomplete="off">
          <label>
            <span>Movimiento</span>
            <select id="ticketMovementType" name="ticketMovementType" required>
              <option value="income">Ingreso</option>
              <option value="expense">Egreso</option>
            </select>
          </label>

          <label>
            <span>Fecha</span>
            <input id="ticketDate" name="ticketDate" type="date" required>
          </label>

          <label>
            <span id="ticketClientLabel">Nombre del cliente</span>
            <input id="ticketClientName" name="ticketClientName" type="text" required>
          </label>

          <label id="ticketTypeLabel">
            <span>Tipo de ticket</span>
            <select id="ticketType" name="ticketType" required>
              <option value="advance">Adelanto</option>
              <option value="full">Pago total</option>
            </select>
          </label>

          <label>
            <span id="ticketDescriptionLabel">Descripción del servicio</span>
            <textarea id="ticketServiceDescription" name="ticketServiceDescription" required></textarea>
          </label>

          <label>
            <span>Detalles adicionales</span>
            <textarea id="ticketDetails" name="ticketDetails"></textarea>
          </label>

          <label id="ticketTotalAmountLabel">
            <span>Monto total del servicio</span>
            <input id="ticketTotalAmount" name="ticketTotalAmount" type="number" min="0" step="0.01">
          </label>

          <label>
            <span id="ticketPaidAmountLabel">Monto cobrado</span>
            <input id="ticketPaidAmount" name="ticketPaidAmount" type="number" min="0" step="0.01" required>
          </label>

          <div class="total-panel" id="ticketPendingPanel">
            <span>Saldo pendiente</span>
            <strong id="ticketPendingAmount">S/ 0.00</strong>
          </div>

          <button class="primary-action" id="ticketContinueButton" type="submit" disabled>Continuar</button>
        </form>
      </section>

      <section class="view" id="ticketPreviewView" aria-labelledby="ticketPreviewTitle">
        <header class="topbar preview-topbar">
          <button class="icon-button" data-action="ticketForm" type="button" aria-label="Editar">‹</button>
          <h2 id="ticketPreviewTitle">Previsualización</h2>
          <div class="preview-actions">
            <button class="small-button" id="downloadTicketButton" type="button">Descargar JPG</button>
            <button class="small-button" id="shareTicketButton" type="button">Compartir</button>
          </div>
        </header>
        <div class="ticket-preview-scroll" aria-label="Previsualización de ticket de pago">
          <canvas id="ticketPreviewCanvas"></canvas>
        </div>
      </section>

      <section class="view" id="ticketHistoryView" aria-labelledby="ticketHistoryTitle">
        <header class="topbar">
          <button class="icon-button" data-action="manager" type="button" aria-label="Volver">‹</button>
          <h2 id="ticketHistoryTitle">Historial de tickets</h2>
        </header>
        <div id="ticketHistoryList" class="history-list"></div>
      </section>
    </main>
  </body>
</html>
